<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heartbeat — Entrar</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f1115;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card {
        background: #171a21;
        border: 1px solid #262b36;
        border-radius: 12px;
        padding: 32px;
        width: 320px;
      }
      h1 {
        color: #d6dae3;
        font-size: 18px;
        margin: 0 0 20px;
      }
      label {
        font-size: 11px;
        color: #7d8598;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        display: block;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        background: #0f1115;
        border: 1px solid #262b36;
        color: #d6dae3;
        padding: 10px;
        border-radius: 6px;
        font-size: 14px;
        margin-bottom: 14px;
      }
      button {
        width: 100%;
        background: #4f8cff;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .error {
        background: rgba(224, 90, 90, 0.12);
        color: #e05a5a;
        border: 1px solid rgba(224, 90, 90, 0.3);
        padding: 10px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 14px;
      }
    </style>
  </head>
  <body>
    <form class="card" method="post" action="/login">
      <h1>Heartbeat</h1>
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        value="{{ email }}"
        required
        autofocus
      />
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required />
      <button type="submit">Entrar</button>
    </form>
  </body>
</html>
