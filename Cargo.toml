[package]
name = "heartbeat"
version = "0.2.0"
edition = "2024"
license = "Elastic-2.0"
publish = false

[dependencies]
# HTTP/1.1 only (nginx terminates TLS and HTTP/2) and no compression: fewer dependencies,
# and no h2 0.3 (RUSTSEC-2026-0258).
actix-web = { version = "4", default-features = false, features = [
    "macros",
    "cookies",
    "unicode",
] }
tera = { version = "2.4.0", features = ["glob_fs"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
getrandom = { version = "0.3", features = ["std"] }
url = "2"
x509-parser = "0.18"
argon2 = { version = "0.5", features = ["std"] }
rust-embed = { version = "8", features = ["mime-guess"] }

[features]
# `just demo` only: synthetic logs for the demo apps (see src/demo.rs).
demo = []

[dev-dependencies]
tempfile = "3"
