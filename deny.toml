# cargo-deny (CI "deps" job): known vulnerabilities, licenses and crate sources.

[advisories]
# Every RustSec advisory (vulnerable, unmaintained, yanked) fails the check; add an
# `ignore = ["RUSTSEC-…"]` entry with a reason only after reviewing it.
version = 2

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# Heartbeat itself isn't published to crates.io.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
